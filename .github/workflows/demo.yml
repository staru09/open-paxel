name: Demo site

# Publishes the dashboard with the pre-generated profile in demo/data to GitHub Pages
# (Settings → Pages → Source: GitHub Actions). Regenerate the data locally with
# demo/build_demo.py; raw transcripts and API keys never reach CI.
on:
  push:
    branches: [main]
    paths: [demo/**, frontend/**, .github/workflows/demo.yml]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build -- --base=/${{ github.event.repository.name }}/ --outDir ../site --emptyOutDir
        working-directory: frontend
        env:
          VITE_DEMO: "1"
      # Demo data, plus an SPA fallback so deep links like /sessions/<id> load the app.
      - run: cp -r demo/data/api site/api && cp site/index.html site/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
